<style>
:root{--ink:#1f2937;--muted:#6b7280;--accent:#4f46e5;--accent2:#7c3aed;--line:#e5e7eb;--bg:#eef2ff}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:linear-gradient(180deg,#eef2ff,#f8fafc 40%,#f3f4f6)}
.header{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;padding:18px 20px}
.header-inner{max-width:1000px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.brand{font-size:20px;font-weight:bold;letter-spacing:1px}
.brand small{display:block;font-weight:normal;font-size:12px;opacity:.85;letter-spacing:0}
.nav a{color:#fff;text-decoration:none;margin-left:16px;font-size:14px;opacity:.9}
.nav a:hover{opacity:1;text-decoration:underline}
.container{max-width:1000px;margin:0 auto;padding:20px}
.ad-slot{background:#fff;border:1px dashed #c7d2fe;border-radius:10px;text-align:center;color:#94a3b8;font-size:12px;padding:8px;margin:16px 0;min-height:90px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ad-slot.wide{min-height:90px}
.ad-slot.side{min-height:250px;margin:0 0 16px}
.ad-label{position:absolute;top:2px;left:6px;font-size:10px;color:#a5b4fc}
.ad-slot{position:relative}
.wrap{background:#fff;padding:30px;border-radius:14px;box-shadow:0 6px 24px rgba(79,70,229,.10);border:1px solid #e0e7ff}
.layout{display:grid;grid-template-columns:1fr 240px;gap:20px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:22px}
h1{margin:0;font-size:30px;letter-spacing:3px;color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.meta{min-width:260px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.card{border:1px solid var(--line);border-radius:10px;padding:16px;background:#fff}
.card h3{margin:0 0 8px;font-size:13px;color:var(--accent);text-transform:uppercase;letter-spacing:1px}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
input,textarea{width:100%;padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;font-family:inherit;background:#fff}
input:focus,textarea:focus{outline:2px solid #c7d2fe;border-color:var(--accent)}
textarea{min-height:60px;resize:vertical}
table{width:100%;border-collapse:collapse;margin-top:8px}
th{background:var(--accent);color:#fff;text-align:left;padding:10px;font-size:13px}
th.num,td.num{text-align:right}
td{border-bottom:1px solid var(--line);padding:6px}
td input{border:none;padding:6px;background:transparent}
td input:focus{outline:1px solid var(--accent);background:#fff}
.btn{background:var(--accent);color:#fff;border:none;padding:10px 16px;border-radius:6px;cursor:pointer;font-size:14px}
.btn:hover{background:#4338ca}
.btn.light{background:#e0e7ff;color:var(--accent)}
.btn.light:hover{background:#c7d2fe}
.btn.danger{background:#fee2e2;color:#b91c1c;padding:6px 10px}
.bar{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center}
.adjust{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.totals{margin-left:auto;width:340px;margin-top:16px;background:#f8fafc;padding:12px 16px;border-radius:10px}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.row.grand{font-weight:bold;font-size:18px;color:var(--accent);border-bottom:none}
.footer{margin-top:28px;color:var(--muted);font-size:13px;text-align:center}
.sidebar .card{margin-bottom:16px}
.sidebar h4{margin:0 0 8px;font-size:13px;color:var(--accent)}
.sidebar ul{padding-left:18px;margin:0;font-size:13px;color:var(--muted);line-height:1.7}
@media (max-width:820px){.layout{grid-template-columns:1fr}.sidebar{display:none}}
@media (max-width:640px){.grid,.adjust{grid-template-columns:1fr}.totals{width:100%}}
@media print{
  body{background:#fff}
  .header,.ad-slot,.sidebar,.no-print{display:none!important}
  .layout{display:block}
  .wrap{box-shadow:none;margin:0;padding:0;max-width:100%;border:none}
  .container{padding:0}
  input,textarea{border:none;padding:2px 0;background:transparent}
  td input{padding:2px}
  .card{border:none;padding:0}
  th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
