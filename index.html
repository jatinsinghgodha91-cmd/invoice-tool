<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Invoice Generator</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#f3f4f6;color:#111827}
.wrap{max-width:800px;margin:30px auto;background:#fff;padding:24px;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
h1{color:#4f46e5;margin:0 0 16px}
label{display:block;font-size:13px;color:#6b7280;margin:10px 0 4px}
input,textarea{width:100%;padding:9px;border:1px solid #d1d5db;border-radius:6px;font-size:14px}
table{width:100%;border-collapse:collapse;margin-top:10px}
th{background:#4f46e5;color:#fff;text-align:left;padding:8px}
td{border-bottom:1px solid #e5e7eb;padding:6px}
td input{border:none;padding:6px}
.btn{background:#4f46e5;color:#fff;border:none;padding:10px 16px;border-radius:6px;cursor:pointer;margin-top:10px}
.total{text-align:right;font-size:18px;font-weight:bold;color:#4f46e5;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>INVOICE</h1>

  <label>Invoice No.</label>
  <input id="invNo" value="INV-001">

  <label>Your business name</label>
  <input id="bizName" placeholder="Your business name">

  <label>Client name</label>
  <input id="clientName" placeholder="Client name">

  <table>
    <thead><tr><th>Description</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead>
    <tbody id="items"></tbody>
  </table>
  <button class="btn" id="addItem" type="button">+ Add item</button>

  <div class="total">Total: $<span id="grand">0.00</span></div>

  <button class="btn" onclick="window.print()" type="button">Print / Save as PDF</button>
</div>

<script>
var tbody = document.getElementById('items');

function addRow(){
  var tr = document.createElement('tr');
  tr.innerHTML =
    '<td><input class="d" placeholder="Service"></td>' +
    '<td><input class="q" type="number" value="1" min="0"></td>' +
    '<td><input class="r" type="number" value="0" min="0"></td>' +
    '<td class="a">0.00</td>';
  tbody.appendChild(tr);
  recalc();
}

function recalc(){
  var total = 0;
  var rows = tbody.querySelectorAll('tr');
  for (var i = 0; i < rows.length; i++) {
    var q = parseFloat(rows[i].querySelector('.q').value) || 0;
    var r = parseFloat(rows[i].querySelector('.r').value) || 0;
    var line = q * r;
    total += line;
    rows[i].querySelector('.a').textContent = line.toFixed(2);
  }
  document.getElementById('grand').textContent = total.toFixed(2);
}

document.getElementById('addItem').onclick = addRow;
document.addEventListener('input', recalc);
addRow();
</script>
</body>
</html>
